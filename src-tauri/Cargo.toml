[package]
name = "paperrealm"
version = "1.46.0"
description = "PaperRealm offline reading room"
authors = ["PaperRealm"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
base64 = "0.22.1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Win32_System_WinRT", "Win32_Security_Cryptography"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
